[project]
name = "nuki_pro"
version = "0.1.0"
description = "Home Assistant custom integration for the Nuki Smart Lock (5th generation): local MQTT + Nuki Web API"
requires-python = ">=3.13"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py313"
line-length = 88
